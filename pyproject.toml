[project]
name = "vspider"
version = "0.1.0"
description = "多平台短视频榜单发现、下载与内容归纳流水线"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.2",
    "typer>=0.12.3",
    "rich>=13.7.0",
    "tenacity>=8.2.2",
    "python-dateutil>=2.9.0",
]

[project.scripts]
vspider = "vspider.cli:app"

[project.optional-dependencies]
download = ["yt-dlp>=2026.1.1"]
# funasr 不会自动带 torch/torchaudio（官方要求单独装），soundfile 是本项目直接 import 的
asr = [
    "funasr>=1.2.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
    "onnxruntime>=1.20.0",
    "modelscope>=1.20.0",
]
ocr = ["rapidocr-onnxruntime>=1.4.0"]
serve = ["fastapi>=0.110.2", "uvicorn>=0.29.0", "sse-starlette>=2.1.0"]
store = ["sqlalchemy>=2.0.43", "aiosqlite>=0.21.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vspider"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
